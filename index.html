<!DOCTYPE html>
<html lang="zh-CN" data-theme="olive-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自定义仪表盘</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">自定义仪表盘</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-refresh-all" class="btn" title="刷新所有小组件与网站">刷新全部</button>
      <button id="btn-add" class="btn btn-primary">+ 添加小组件</button>
      <button id="btn-export" class="btn" title="导出配置为 JSON 文件">导出</button>
      <button id="btn-import" class="btn" title="从 JSON 文件导入配置">导入</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden />
      <button id="btn-edit" class="btn">编辑</button>
      <button id="btn-settings" class="btn btn-icon" title="设置">⚙</button>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <div id="modal-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
